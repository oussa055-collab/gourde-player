name: Build Gourde Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Décompresser le projet
        run: |
          Z=""
          BEST=0
          while IFS= read -r f; do
            T=$(git log -1 --format=%ct -- "$f")
            T=${T:-0}
            if [ "$T" -gt "$BEST" ]; then
              BEST=$T
              Z="$f"
            fi
          done < <(find . -maxdepth 2 -name '*.zip' -not -path './.git/*')
          echo "Zip trouvé : $Z"
          if [ -z "$Z" ]; then exit 1; fi
          unzip -q "$Z" -d project

      - name: Trouver la racine du projet
        run: |
          S=$(find project -name settings.gradle.kts | head -n 1)
          echo "Fichier trouvé : $S"
          if [ -z "$S" ]; then
            ls -R project | head -60
            exit 1
          fi
          echo "ROOT=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Compiler l'APK
        run: cd "$ROOT" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GourdePlayer-apk
          path: project/**/build/outputs/apk/debug/*.apk
