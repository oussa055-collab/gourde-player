name: Build Gourde Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          Z=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          echo "Zip trouvé : $Z"
          unzip -q "$Z" -d project

      - name: Trouver la racine du projet
        run: |
          S=$(find project -name settings.gradle.kts | head -n 1)
          echo "Fichier trouvé : $S"
          if [ -z "$S" ]; then
            ls -R project | head -60
            exit 1
          fi
          echo "ROOT=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Compiler l'APK
        run: cd "$ROOT" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GourdePlayer-apk
          path: project/**/build/outputs/apk/debug/*.apk
